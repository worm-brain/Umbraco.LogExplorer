# Security gate: CodeQL, a secret scan over the whole git history, a NuGet vulnerability audit and a check
# of what the packed .nupkg files contain. It runs on pull requests and on demand, and release.yml calls it
# as its first job, so nothing is packed or published from a tag that fails it.
#
# An accepted finding is suppressed where it is reported, so it does not fail later runs:
#   - CodeQL      -> dismiss the alert in the repository's Security tab.
#   - Secret scan -> add the finding's fingerprint to .gitleaksignore (whole paths go in .gitleaks.toml).
#   - NuGet audit -> add the advisory URL to security/nuget-audit-allowlist.txt, with who, why and when.
#
# Nothing here names the repository: another package repository can copy this file as it is, adjusting
# only the Umbraco majors in the dependency audit and the Bun version.
name: Security

# No push or scheduled runs, to save Actions minutes: pull requests, manual runs and every release.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push to the same pull request cancels the older run. When release.yml calls this file,
# github.workflow is the caller's name ("Release"), so a manual run can never cancel a release's gate.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege; the CodeQL job widens its own. A caller must grant at least what the CodeQL job asks
# for, even when the job is skipped, because GitHub checks a called workflow's permissions before any `if:`.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment) because this workflow gates
# releases: a moved tag must not change what runs. Dependabot keeps the pins current.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    # Code scanning on a private repository needs paid GitHub Advanced Security, so CodeQL runs only while
    # the repository is public. In a call from release.yml, `github.event` is the caller's tag push.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The .NET package and the backoffice client (TypeScript) that ships inside it.
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-mode none extracts both languages without a build, so no SDK, Bun or restore step is
      # needed and a broken build cannot hide the analysis. Switch C# to build-mode manual (restore and
      # build between init and analyze) if deeper data-flow extraction is ever needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the tip

      - name: Scan history for secrets
        shell: pwsh
        run: ./.github/scripts/secret-scan.ps1

  dependencies:
    name: NuGet vulnerabilities (Umbraco ${{ matrix.umbraco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each Umbraco major restores its own dependency graph (ADR 0010), so each is audited.
        umbraco: [17, 18]
    env:
      # `dotnet list package` evaluates the projects itself and takes no -p: switches, so the major
      # reaches it as an environment variable, which MSBuild reads as a property like any other.
      UmbracoMajor: ${{ matrix.umbraco }}
      # NuGet's own restore-time audit is switched off here: with warnings as errors it would stop the
      # restore at the first advisory, before the allowlist is read. The script below makes the call.
      NuGetAudit: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Audits the packages every project references directly, which for the package projects are the
      # dependencies their nuspec declares. Transitive packages are left out on purpose: a consuming site
      # resolves the package's own against its Umbraco version (here they would only ever be the floor's),
      # and the build's NuGet audit already covers the tests' and samples' on every CI run.
      - name: Audit vulnerable packages
        shell: pwsh
        run: ./.github/scripts/nuget-audit.ps1 -Threshold High

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Packing builds the backoffice client, which ships inside the package.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      # Every package project (src/), at the default Umbraco major: the majors ship the same files.
      - name: Pack
        run: for project in src/*/*.csproj; do dotnet pack "$project" -o artifacts; done

      # Lists every file of every .nupkg and fails on key, certificate or settings files and on
      # secret-like text, so nothing but the package itself reaches nuget.org.
      - name: Audit package contents
        shell: pwsh
        run: ./.github/scripts/package-audit.ps1 -PackageDir artifacts
