# Packs every package when a version tag is pushed. One package line per Umbraco major (ADR 0010):
# the tag's first number selects the major, so v17.0.0-alpha.1 packs the Umbraco 17 build and
# v18.0.0-alpha.1 packs the Umbraco 18 build, each at the tag's version.
#
# Publishing to nuget.org is a separate job that stays disabled until the first alpha (issue #52).
# It uses NuGet trusted publishing, so no API key is stored: the job exchanges its GitHub OIDC token for a
# short-lived key. One-off setup before enabling: add a trusted publishing policy on nuget.org for this
# repository and release.yml, create the `nuget` environment with a required reviewer, and set the
# repository variable NUGET_USER.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # The tag sets the version for every package; its major (17 or 18) selects the Umbraco build.
      - name: Resolve the version and Umbraco major from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          if [ "$major" != "17" ] && [ "$major" != "18" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must start with the Umbraco major (v17.x.y or v18.x.y)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - run: dotnet test --solution Umbraco.Community.LogExplorer.slnx -p:UmbracoMajor=${{ steps.version.outputs.major }}

      # Builds the client too, and produces each .nupkg with its .snupkg symbol package.
      - run: dotnet pack Umbraco.Community.LogExplorer.slnx -o artifacts -p:UmbracoMajor=${{ steps.version.outputs.major }} -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/

  publish:
    # Off until the first alpha release (#52). Remove this condition to enable publishing.
    if: false
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # needed to request the OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts/

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing a .nupkg also pushes the matching .snupkg from the same folder. No --skip-duplicate:
      # a rejected push must fail the job rather than pass silently.
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
