# Runs the Playwright e2e suite (ADR 0020) against the sample site of each Umbraco major: the job
# builds the client and the site, starts the site (fresh SQLite, unattended install) and runs
# `bun run e2e` for that major only.
name: E2E

on:
  pull_request:
  push:
    branches: [main, phase-1]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  e2e:
    name: E2E Umbraco ${{ matrix.umbraco }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17, 18]
    env:
      E2E_SITES: ${{ matrix.umbraco }}
    defaults:
      run:
        working-directory: src/Umbraco.Community.LogExplorer/Client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # The Playwright runner is a Node program; `bun run e2e` starts it through its node shebang.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # The sites serve HTTPS only for the backoffice login (OpenIddict refuses HTTP); Kestrel picks
      # up the development certificate, and the tests ignore that it is untrusted.
      - run: dotnet dev-certs https

      # Browsers are cached per Playwright version; OS packages are installed every run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: bunx playwright install --with-deps chromium

      # e2e/prepare.ts builds the client and the site for this major before Playwright starts it.
      - run: bun run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-umbraco-${{ matrix.umbraco }}
          path: |
            src/Umbraco.Community.LogExplorer/Client/e2e/playwright-report/
            src/Umbraco.Community.LogExplorer/Client/e2e/test-results/
          if-no-files-found: ignore
