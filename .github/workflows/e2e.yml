# Runs the Playwright e2e suite (ADR 0020) against the sample site of each Umbraco major: the job
# builds the client and the site, starts the site (fresh SQLite, unattended install) and runs
# `bun run e2e` for that major only.
name: E2E

# Pull requests only: pushes to branches do not run this, to save Actions minutes.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  e2e:
    name: E2E Umbraco ${{ matrix.umbraco }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        umbraco: [17, 18]
    env:
      E2E_SITES: ${{ matrix.umbraco }}
    defaults:
      run:
        working-directory: src/Umbraco.Community.LogExplorer/Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3

      # The Playwright runner is a Node program; `bun run e2e` starts it through its node shebang.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # The sites serve HTTPS only for the backoffice login (OpenIddict refuses HTTP); Kestrel picks
      # up the development certificate, and the tests ignore that it is untrusted.
      - run: dotnet dev-certs https

      # Browsers are cached per Playwright version; OS packages are installed every run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: bunx playwright install --with-deps chromium

      # e2e/prepare.ts builds the client and the site for this major before Playwright starts it.
      - run: bun run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-umbraco-${{ matrix.umbraco }}
          path: |
            src/Umbraco.Community.LogExplorer/Client/e2e/playwright-report/
            src/Umbraco.Community.LogExplorer/Client/e2e/test-results/
          if-no-files-found: ignore
